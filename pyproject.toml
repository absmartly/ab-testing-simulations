[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ab-testing-simulations"
version = "1.0.0"
description = "Reproducible simulations of Bayesian A/B testing claims"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ABsmartly"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ab-simulations = "ab_testing_simulations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ab_testing_simulations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
